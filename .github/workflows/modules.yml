name: CI-Modules

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          mods=$(for d in Modules/*/ Modules/*/*/; do
            if [ -f "$d/Package.swift" ] && grep -q '.testTarget' "$d/Package.swift"; then
              echo "${d%/}"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$mods" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.module }}
        run: swift test --package-path "${{ matrix.module }}" -Xswiftc -warnings-as-errors
