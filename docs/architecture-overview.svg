<svg viewBox="0 0 1060 806" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1060" height="806" fill="#0d1117"/>
<style>.h{font-size:15px;font-weight:600;fill:#e6edf3}.n{font-size:13.5px;font-weight:600}.d{font-size:11.5px;fill:#8b949e}</style>
<defs><marker id="dep" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#8b949e" stroke-width="1.6"/></marker><marker id="net" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#ffa657" stroke-width="1.8"/></marker></defs>
<text x="530" y="24" class="h" text-anchor="middle">Sales in USD, iOS 17.0, Swift 6 strict concurrency, one workspace, three screens</text>
<text x="530" y="42" class="d" text-anchor="middle">Dashed arrow: depends on. The app talks to two services. Only the middleware knows how to chain a currency to US dollars.</text>
<rect x="36" y="56" width="470" height="84" rx="9" fill="#161b22" stroke="#6e7681" stroke-width="1.6"/>
<text x="48" y="75" class="n" fill="#6e7681">The given backend</text>
<text x="48" y="93" class="d">ile-b2p4.essentialdeveloper.com. POST /login, GET /products, GET /sales,</text>
<text x="48" y="108" class="d">all three behind an Authorization header, plus its own GET /rates.</text>
<text x="48" y="123" class="d">Fixed: other clients depend on it, so it cannot change for us.</text>
<rect x="554" y="56" width="470" height="84" rx="9" fill="#161b22" stroke="#ffa657" stroke-width="1.6"/>
<text x="566" y="75" class="n" fill="#ffa657">sales-middleware, this challenge's backend</text>
<text x="566" y="93" class="d">A Swift server, localhost:8080. One endpoint, GET /rates.</text>
<text x="566" y="108" class="d">Reads the backend's mixed pairs, derives the missing inverses and walks</text>
<text x="566" y="123" class="d">outwards from USD, returning one direct-to-USD rate per currency.</text>
<path d="M550,98 L512,98" stroke="#ffa657" stroke-width="1.6" fill="none" marker-end="url(#net)"/>
<text x="531" y="90" class="d" text-anchor="middle" fill="#ffa657">reads</text>
<rect x="16" y="166" width="1028" height="624" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="36" y="178" width="988" height="66" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="48" y="197" class="n" fill="#e3b341">App: Composition Root</text>
<text x="48" y="215" class="d">The only place concretes meet. It signs every backend request with the stored token and sends the rates request unsigned to the middleware.</text>
<text x="48" y="230" class="d">AppRouter owns the screen and the navigation path. Product+ProductDetail translates one vertical's Product into the other's.</text>
<path d="M300,176 L300,144" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<text x="310" y="166" class="d" text-anchor="start" fill="#8b949e">token, products, sales</text>
<path d="M760,176 L760,144" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<text x="770" y="166" class="d" text-anchor="start" fill="#8b949e">rates</text>
<rect x="36" y="264" width="300" height="386" rx="9" fill="none" stroke="#30363d" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="48" y="286" class="n" text-anchor="start" fill="#e6edf3">Login (one package)</text>
<rect x="48" y="298" width="276" height="62" rx="9" fill="#161b22" stroke="#f78166" stroke-width="1.6"/>
<text x="60" y="317" class="n" fill="#f78166">LoginUI</text>
<text x="60" y="335" class="d">SwiftUI. The login form, its</text>
<text x="60" y="350" class="d">loading, error and expiry states.</text>
<rect x="48" y="386" width="276" height="62" rx="9" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="60" y="405" class="n" fill="#d2a8ff">LoginPresentation</text>
<text x="60" y="423" class="d">@Observable view model, localized</text>
<text x="60" y="438" class="d">strings. No networking in scope.</text>
<rect x="48" y="474" width="276" height="62" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="60" y="493" class="n" fill="#58a6ff">LoginFeature</text>
<text x="60" y="511" class="d">Credentials, the AuthAPI seam,</text>
<text x="60" y="526" class="d">LoginUseCase. Foundation only.</text>
<rect x="48" y="562" width="276" height="62" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="60" y="581" class="n" fill="#3fb950">LoginAPI</text>
<text x="60" y="599" class="d">Endpoint and mapper. Knows</text>
<text x="60" y="614" class="d">access_token, never the client.</text>
<path d="M186,246 L186,260" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M186,362 L186,384" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M186,450 L186,472" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M186,538 L186,560" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<rect x="380" y="264" width="300" height="386" rx="9" fill="none" stroke="#30363d" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="392" y="286" class="n" text-anchor="start" fill="#e6edf3">ProductList (one package)</text>
<rect x="392" y="298" width="276" height="62" rx="9" fill="#161b22" stroke="#f78166" stroke-width="1.6"/>
<text x="404" y="317" class="n" fill="#f78166">ProductListUI</text>
<text x="404" y="335" class="d">SwiftUI. The list, its rows,</text>
<text x="404" y="350" class="d">loading, empty and error states.</text>
<rect x="392" y="386" width="276" height="62" rx="9" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="404" y="405" class="n" fill="#d2a8ff">ProductListPresentation</text>
<text x="404" y="423" class="d">Row mapper and a typealias over</text>
<text x="404" y="438" class="d">the shared LoadableViewModel.</text>
<rect x="392" y="474" width="276" height="62" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="404" y="493" class="n" fill="#58a6ff">ProductListFeature</text>
<text x="404" y="511" class="d">Product, Sale, ProductSummary,</text>
<text x="404" y="526" class="d">ProductSummaryPolicy. No imports.</text>
<rect x="392" y="562" width="276" height="62" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="404" y="581" class="n" fill="#3fb950">ProductListAPI</text>
<text x="404" y="599" class="d">Two endpoints, two mappers.</text>
<text x="404" y="614" class="d">Keeps one field from a sale.</text>
<path d="M530,246 L530,260" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M530,362 L530,384" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M530,450 L530,472" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M530,538 L530,560" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<rect x="724" y="264" width="300" height="386" rx="9" fill="none" stroke="#30363d" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="736" y="286" class="n" text-anchor="start" fill="#e6edf3">ProductDetail (one package)</text>
<rect x="736" y="298" width="276" height="62" rx="9" fill="#161b22" stroke="#f78166" stroke-width="1.6"/>
<text x="748" y="317" class="n" fill="#f78166">ProductDetailUI</text>
<text x="748" y="335" class="d">SwiftUI. The sales list, the</text>
<text x="748" y="350" class="d">summary header, every state.</text>
<rect x="736" y="386" width="276" height="62" rx="9" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="748" y="405" class="n" fill="#d2a8ff">ProductDetailPresentation</text>
<text x="748" y="423" class="d">View mapper, money and date</text>
<text x="748" y="438" class="d">formatters, the view model.</text>
<rect x="736" y="474" width="276" height="62" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="748" y="493" class="n" fill="#58a6ff">ProductDetailFeature</text>
<text x="748" y="511" class="d">Money, RateTable, DetailedSale,</text>
<text x="748" y="526" class="d">ProductDetailPolicy. No imports.</text>
<rect x="736" y="562" width="276" height="62" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="748" y="581" class="n" fill="#3fb950">ProductDetailAPI</text>
<text x="748" y="599" class="d">Sales and rates endpoints.</text>
<text x="748" y="614" class="d">Decimal from strings, never Double.</text>
<path d="M874,246 L874,260" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M874,362 L874,384" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M874,450 L874,472" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<path d="M874,538 L874,560" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#dep)"/>
<text x="36" y="686" class="n" text-anchor="start" fill="#79c0ff">Shared horizontals, technical only, no feature knows another exists</text>
<rect x="36" y="698" width="232" height="62" rx="9" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/>
<text x="48" y="717" class="n" fill="#79c0ff">Auth</text>
<text x="48" y="735" class="d">Token, the TokenStore seam, the</text>
<text x="48" y="750" class="d">Keychain store and the decorator.</text>
<rect x="288" y="698" width="232" height="62" rx="9" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/>
<text x="300" y="717" class="n" fill="#79c0ff">HTTPClient</text>
<text x="300" y="735" class="d">The one method seam plus its</text>
<text x="300" y="750" class="d">URLSession implementation.</text>
<rect x="540" y="698" width="232" height="62" rx="9" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/>
<text x="552" y="717" class="n" fill="#79c0ff">SharedPresentation</text>
<text x="552" y="735" class="d">LoadableViewModel, the money</text>
<text x="552" y="750" class="d">formatter, Bundle.localized.</text>
<rect x="792" y="698" width="232" height="62" rx="9" fill="#161b22" stroke="#79c0ff" stroke-width="1.6"/>
<text x="804" y="717" class="n" fill="#79c0ff">TestSupport</text>
<text x="804" y="735" class="d">Spies, stubs, leak tracking.</text>
<text x="804" y="750" class="d">Linked by test bundles only.</text>
</svg>
