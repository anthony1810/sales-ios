<text x="570" y="286" class="d" text-anchor="start" fill="#3fb950">ProductDetail</text>
<rect x="350" y="308" width="360" height="56" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="530" y="331" class="n" text-anchor="middle" fill="#e3b341">ProductDetailService</text>
<text x="530" y="350" class="d" text-anchor="middle">try await on sales, try? on rates</text>
