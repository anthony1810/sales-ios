<svg viewBox="0 0 1060 744" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1060" height="744" fill="#0d1117"/>
