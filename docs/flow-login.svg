<svg viewBox="0 0 1060 744" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1060" height="744" fill="#0d1117"/>
<style>.h{font-size:15px;font-weight:600;fill:#e6edf3}.n{font-size:13.5px;font-weight:600}.d{font-size:11.5px;fill:#8b949e}</style>
<defs><marker id="go" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#58a6ff" stroke-width="1.8"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#3fb950" stroke-width="1.8"/></marker></defs>
<text x="530" y="28" class="h" text-anchor="middle">Login: one sign in, from a keystroke to a stored token</text>
<text x="530" y="48" class="d" text-anchor="middle">LoginPresentation never sees a status code. LoginResponseMapper is the only file that knows the server writes access_token.</text>
<text x="348" y="76" class="d" text-anchor="end" fill="#58a6ff">the call going down</text>
<text x="712" y="76" class="d" text-anchor="start" fill="#3fb950">the value coming back up</text>
<rect x="350" y="92" width="360" height="56" rx="9" fill="#161b22" stroke="#f78166" stroke-width="1.6"/>
<text x="530" y="115" class="n" text-anchor="middle" fill="#f78166">LoginSUView</text>
<text x="530" y="134" class="d" text-anchor="middle">SwiftUI, binds to the view model</text>
<path d="M500,152 L500,194" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#go)"/>
<path d="M560,194 L560,152" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#back)"/>
<text x="490" y="178" class="d" text-anchor="end" fill="#58a6ff">Credentials</text>
<text x="570" y="178" class="d" text-anchor="start" fill="#3fb950">nothing, or an error</text>
<rect x="350" y="200" width="360" height="56" rx="9" fill="#161b22" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="530" y="223" class="n" text-anchor="middle" fill="#d2a8ff">LoginViewModel</text>
<text x="530" y="242" class="d" text-anchor="middle">isLoading, errorMessage, onSuccess</text>
<path d="M500,260 L500,302" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#go)"/>
<path d="M560,302 L560,260" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#back)"/>
<text x="490" y="286" class="d" text-anchor="end" fill="#58a6ff">Credentials</text>
<text x="570" y="286" class="d" text-anchor="start" fill="#3fb950">Token, stored</text>
<rect x="350" y="308" width="360" height="56" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
<text x="530" y="331" class="n" text-anchor="middle" fill="#58a6ff">LoginUseCase</text>
<text x="530" y="350" class="d" text-anchor="middle">the rule: a success leaves a stored token</text>
<path d="M500,368 L500,410" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#go)"/>
<path d="M560,410 L560,368" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#back)"/>
<text x="490" y="394" class="d" text-anchor="end" fill="#58a6ff">Credentials</text>
<text x="570" y="394" class="d" text-anchor="start" fill="#3fb950">Token</text>
<rect x="350" y="416" width="360" height="56" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
<text x="530" y="439" class="n" text-anchor="middle" fill="#e3b341">RemoteAuthAPI</text>
<text x="530" y="458" class="d" text-anchor="middle">the adapter that implements the AuthAPI seam</text>
<path d="M500,476 L500,518" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#go)"/>
<path d="M560,518 L560,476" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#back)"/>
<text x="490" y="502" class="d" text-anchor="end" fill="#58a6ff">Credentials</text>
<text x="570" y="502" class="d" text-anchor="start" fill="#3fb950">Token</text>
<rect x="350" y="524" width="360" height="56" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="530" y="547" class="n" text-anchor="middle" fill="#3fb950">LoginEndpoint</text>
<text x="530" y="566" class="d" text-anchor="middle">POST /login with a JSON body</text>
<path d="M500,584 L500,626" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#go)"/>
<path d="M560,626 L560,584" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#back)"/>
<text x="490" y="610" class="d" text-anchor="end" fill="#58a6ff">URLRequest, then Data</text>
<text x="570" y="610" class="d" text-anchor="start" fill="#3fb950">Data and 200 or 401</text>
<rect x="350" y="632" width="360" height="56" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
<text x="530" y="655" class="n" text-anchor="middle" fill="#3fb950">LoginResponseMapper</text>
<text x="530" y="674" class="d" text-anchor="middle">200 to Token, 401 to the server's message</text>
</svg>
